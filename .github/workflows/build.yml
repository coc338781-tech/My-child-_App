name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip -d $HOME
        echo "$HOME/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/app/my-release-key.jks

     - name: Inject Bot Token
  run: |
    if [ "${{ github.ref }}" = "refs/heads/User_01" ]; then
      TOKEN="${{ secrets.BOT_TOKEN_USER01 }}"
    else
      TOKEN="${{ secrets.BOT_TOKEN_MAIN }}"
    fi
    sed -i "s|const val BOT_TOKEN = \".*\"|const val BOT_TOKEN = \"$TOKEN\"|" app/src/main/java/com/coc338781/childapp/MonitoringService.kt
    - name: Build Release APK
      run: gradle assembleRelease --stacktrace
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/app/my-release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: child-app-release
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        files: app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Telegram Notification
      if: success()
      run: |
        APK_URL="https://github.com/coc338781-tech/My-child-_App/releases/download/build-${{ github.run_number }}/app-release.apk"
        MESSAGE="📦 New APK Ready!%0A%0A/update $APK_URL"
        curl -s -X POST "https://api.telegram.org/bot8968739971:AAEsGJc_-MNGE8KKxqwzaZM3TPinPVg_Bms/sendMessage" \
          -d "chat_id=7905408190" \
          -d "text=$MESSAGE"
